<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>Daily Calorie Tally</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --card: #151c2f;
      --card-2: #1c2540;
      --text: #f8fafc;
      --muted: #9ca3af;
      --accent: #60a5fa;
      --good: #34d399;
      --bad: #fb7185;
      --border: rgba(255,255,255,.09);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, #16213f 0%, var(--bg) 45%);
      color: var(--text);
      padding: 18px;
    }

    .app {
      width: min(100%, 520px);
      margin: 0 auto;
    }

    h1 {
      font-size: clamp(1.7rem, 7vw, 2.4rem);
      margin: 10px 0 6px;
    }

    .subtitle {
      color: var(--muted);
      margin: 0 0 18px;
      line-height: 1.4;
    }

    .card {
      background: rgba(21, 28, 47, .92);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 16px 40px rgba(0,0,0,.2);
    }

    .label {
      color: var(--muted);
      font-size: .9rem;
      margin-bottom: 4px;
    }

    .big-number {
      font-size: clamp(2.3rem, 12vw, 4rem);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .remaining {
      margin-top: 8px;
      font-size: 1.05rem;
    }

    .progress-shell {
      height: 16px;
      border-radius: 999px;
      overflow: hidden;
      background: #0b1224;
      margin-top: 16px;
      border: 1px solid var(--border);
    }

    .progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--good), var(--accent));
      transition: width .2s ease;
    }

    .progress.over {
      background: var(--bad);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .metric {
      background: var(--card-2);
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 16px;
    }

    .metric strong {
      display: block;
      font-size: 1.35rem;
      margin-top: 3px;
    }

    .entry-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    input[type="number"] {
      width: 100%;
      min-height: 52px;
      font-size: 1.1rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #0b1224;
      color: var(--text);
      padding: 0 14px;
      outline: none;
    }

    input[type="number"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(96,165,250,.15);
    }

    button {
      min-height: 52px;
      border: 0;
      border-radius: 14px;
      padding: 0 18px;
      font-size: 1rem;
      font-weight: 750;
      cursor: pointer;
      touch-action: manipulation;
    }

    .add-btn {
      background: var(--accent);
      color: #07111f;
    }

    .quick-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .quick-buttons button {
      background: #25304f;
      color: var(--text);
      padding: 0 8px;
    }

    .history {
      display: grid;
      gap: 8px;
      margin-top: 14px;
      max-height: 320px;
      overflow-y: auto;
    }

    .history-item {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      background: #11182b;
      border: 1px solid var(--border);
      border-radius: 13px;
    }

    .history-time {
      color: var(--muted);
      font-size: .85rem;
    }

    .history-calories {
      font-weight: 750;
    }

    .delete-entry {
      min-height: 34px;
      width: 34px;
      padding: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--bad);
      font-size: 1.1rem;
    }

    .bottom-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .secondary {
      background: #25304f;
      color: var(--text);
    }

    .danger {
      background: rgba(251,113,133,.14);
      color: #fecdd3;
      border: 1px solid rgba(251,113,133,.25);
    }

    .date-line {
      color: var(--muted);
      font-size: .9rem;
      margin-top: 8px;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 14px 0 4px;
    }

    @media (max-width: 420px) {
      body { padding: 12px; }
      .card { padding: 15px; border-radius: 17px; }
      .quick-buttons { grid-template-columns: repeat(2, 1fr); }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Daily Calorie Tally</h1>
    <p class="subtitle">Daily target: <strong>2,300 calories</strong>. Data stays in this browser.</p>

    <section class="card">
      <div class="label">Calories today</div>
      <div id="totalCalories" class="big-number">0</div>
      <div id="remainingText" class="remaining">2,300 remaining</div>

      <div class="progress-shell" aria-label="Daily calorie progress">
        <div id="progressBar" class="progress"></div>
      </div>

      <div id="dateLine" class="date-line"></div>
    </section>

    <section class="card">
      <div class="grid">
        <div class="metric">
          <span class="label">Estimated daily weight change</span>
          <strong id="weightChange">0.675 lb lost</strong>
        </div>
        <div class="metric">
          <span class="label">Calories below / above target</span>
          <strong id="calorieDifference">2,300 under</strong>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="label">Add calories</div>
      <div class="entry-row">
        <input
          id="calorieInput"
          type="number"
          inputmode="numeric"
          min="1"
          step="1"
          placeholder="e.g. 350"
          aria-label="Calories to add"
        />
        <button id="addButton" class="add-btn">Add</button>
      </div>

      <div class="quick-buttons">
        <button data-add="50">+50</button>
        <button data-add="100">+100</button>
        <button data-add="250">+250</button>
        <button data-add="500">+500</button>
      </div>
    </section>

    <section class="card">
      <div class="label">Today's entries</div>
      <div id="history" class="history"></div>

      <div class="bottom-actions">
        <button id="undoButton" class="secondary">Undo last</button>
        <button id="resetButton" class="danger">Reset today</button>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const DAILY_TARGET = 2300;
      const STORAGE_KEY = "dailyCalorieTally_v1";

      const totalEl = document.getElementById("totalCalories");
      const remainingEl = document.getElementById("remainingText");
      const progressEl = document.getElementById("progressBar");
      const weightEl = document.getElementById("weightChange");
      const differenceEl = document.getElementById("calorieDifference");
      const dateLineEl = document.getElementById("dateLine");
      const inputEl = document.getElementById("calorieInput");
      const historyEl = document.getElementById("history");
      const addButton = document.getElementById("addButton");
      const undoButton = document.getElementById("undoButton");
      const resetButton = document.getElementById("resetButton");

      function localDateKey(date = new Date()) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function newState() {
        return {
          date: localDateKey(),
          entries: []
        };
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return newState();

          const parsed = JSON.parse(raw);

          if (
            !parsed ||
            parsed.date !== localDateKey() ||
            !Array.isArray(parsed.entries)
          ) {
            return newState();
          }

          return parsed;
        } catch {
          return newState();
        }
      }

      let state = loadState();

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function ensureCurrentDay() {
        if (state.date !== localDateKey()) {
          state = newState();
          saveState();
        }
      }

      function getTotal() {
        return state.entries.reduce((sum, entry) => sum + entry.calories, 0);
      }

      function formatNumber(value) {
        return Math.round(value).toLocaleString();
      }

      function render() {
        ensureCurrentDay();

        const total = getTotal();
        const difference = DAILY_TARGET - total;

        // User-provided formula:
        // weight lost daily = (2300 - total) / 2800 * 0.821428571
        const weightChange = (difference / 2800) * 0.821428571;

        totalEl.textContent = formatNumber(total);

        if (difference >= 0) {
          remainingEl.textContent = `${formatNumber(difference)} calories remaining`;
          differenceEl.textContent = `${formatNumber(difference)} under`;
        } else {
          remainingEl.textContent = `${formatNumber(Math.abs(difference))} calories over`;
          differenceEl.textContent = `${formatNumber(Math.abs(difference))} over`;
        }

        if (weightChange >= 0) {
          weightEl.textContent = `${weightChange.toFixed(3)} lb lost`;
        } else {
          weightEl.textContent = `${Math.abs(weightChange).toFixed(3)} lb gained`;
        }

        const percent = (total / DAILY_TARGET) * 100;
        progressEl.style.width = `${Math.min(percent, 100)}%`;
        progressEl.classList.toggle("over", total > DAILY_TARGET);

        const today = new Date();
        dateLineEl.textContent = today.toLocaleDateString(undefined, {
          weekday: "long",
          month: "long",
          day: "numeric",
          year: "numeric"
        });

        renderHistory();
      }

      function renderHistory() {
        historyEl.innerHTML = "";

        if (state.entries.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "No calories logged yet.";
          historyEl.appendChild(empty);
          return;
        }

        [...state.entries].reverse().forEach((entry) => {
          const item = document.createElement("div");
          item.className = "history-item";

          const left = document.createElement("div");
          left.innerHTML = `
            <div class="history-calories">${formatNumber(entry.calories)} cal</div>
            <div class="history-time">${new Date(entry.timestamp).toLocaleTimeString([], {
              hour: "numeric",
              minute: "2-digit"
            })}</div>
          `;

          const spacer = document.createElement("div");

          const deleteButton = document.createElement("button");
          deleteButton.className = "delete-entry";
          deleteButton.textContent = "×";
          deleteButton.setAttribute("aria-label", `Delete ${entry.calories} calorie entry`);
          deleteButton.addEventListener("click", () => {
            state.entries = state.entries.filter((item) => item.id !== entry.id);
            saveState();
            render();
          });

          item.append(left, spacer, deleteButton);
          historyEl.appendChild(item);
        });
      }

      function addCalories(amount) {
        ensureCurrentDay();

        const calories = Number(amount);
        if (!Number.isFinite(calories) || calories <= 0) return;

        state.entries.push({
          id: crypto.randomUUID
            ? crypto.randomUUID()
            : `${Date.now()}-${Math.random()}`,
          calories: Math.round(calories),
          timestamp: new Date().toISOString()
        });

        saveState();
        render();
      }

      addButton.addEventListener("click", () => {
        addCalories(inputEl.value);
        inputEl.value = "";
        inputEl.focus();
      });

      inputEl.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          addButton.click();
        }
      });

      document.querySelectorAll("[data-add]").forEach((button) => {
        button.addEventListener("click", () => {
          addCalories(button.dataset.add);
        });
      });

      undoButton.addEventListener("click", () => {
        ensureCurrentDay();
        if (state.entries.length === 0) return;

        state.entries.pop();
        saveState();
        render();
      });

      resetButton.addEventListener("click", () => {
        if (!confirm("Clear all calorie entries for today?")) return;

        state = newState();
        saveState();
        render();
      });

      // Re-check periodically so an open page resets shortly after midnight.
      setInterval(() => {
        const previousDate = state.date;
        ensureCurrentDay();
        if (state.date !== previousDate) render();
      }, 30_000);

      // Also check when returning to the page/app.
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) render();
      });

      render();
    })();
  </script>
</body>
</html>
