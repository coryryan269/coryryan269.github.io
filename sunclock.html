<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temple • Daylight</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b1220;color:#f3f6fd;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:24px}main{width:min(740px,100%)}.place{font-size:12px;letter-spacing:.18em;color:#9aadc8;text-transform:uppercase}h1{font-size:clamp(35px,7vw,62px);letter-spacing:-.055em;margin:12px 0 5px}#status{color:#bdc9da;font-size:16px}.track{height:72px;position:relative;border-radius:15px;margin:68px 0 47px;box-shadow:0 8px 38px #0005;isolation:isolate}.track canvas{width:100%;height:100%;border-radius:15px;display:block}.now{position:absolute;top:-12px;height:96px;border-left:3px solid #fff;filter:drop-shadow(0 0 5px #fff)}.now span{position:absolute;top:-25px;left:0;transform:translateX(-50%);font-size:11px;font-weight:700}.ticks{position:absolute;left:0;right:0;top:0}.tick{position:absolute;height:72px;border-left:1px solid #ffffff3b}.tick span{position:absolute;top:82px;transform:translateX(-50%);font-size:12px;color:#9eacc2}.zoom-label{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 8px;color:#aebdd2;font-size:13px}.zoom-label strong{color:#f2f5fc;font-size:15px}.zoom-track{height:55px;border-radius:12px;overflow:hidden;box-shadow:0 6px 24px #0004}.zoom-track canvas{width:100%;height:100%;display:block}.zoom-ticks{display:flex;justify-content:space-between;margin:9px 0 35px;color:#8fa2bd;font-size:12px}.stats{display:flex;justify-content:space-between;gap:12px}.stat{font-size:13px;color:#a1b0c8}.stat b{display:block;font-size:clamp(20px,4vw,31px);color:#fff;margin-top:4px}footer{font-size:12px;color:#7689a4;margin-top:40px;line-height:1.7}@media(max-width:420px){.track{height:58px}.tick{height:58px}.tick span{top:68px}.now{height:82px}}
</style></head><body><main><div class="place">Temple, Texas · Central time</div><h1 id="title">Daylight</h1><div id="status">Calculating the sun…</div><div class="track"><canvas id="sky"></canvas><div class="ticks" id="ticks"></div><div class="now" id="now"><span>NOW</span></div></div><div class="zoom-label"><strong>Next 2 hours</strong><span id="zoom-range">Now → +2h</span></div><div class="zoom-track"><canvas id="zoom"></canvas></div><div class="zoom-ticks"><span id="z0">Now</span><span id="z1">+30m</span><span id="z2">+1h</span><span id="z3">+1h 30m</span><span id="z4">+2h</span></div><div class="stats"><div class="stat">Sunrise<b id="rise">—</b></div><div class="stat">Sunset<b id="set">—</b></div><div class="stat">Daylight<b id="duration">—</b></div></div><footer>Smooth sunlight timeline · midnight to midnight<br>Calculated locally from Temple's coordinates. No API, internet connection, or location permissions required.</footer></main><script>
const LAT=31.0982,LON=-97.3428,TZ='America/Chicago',rad=Math.PI/180;
const $=id=>document.getElementById(id);
function localParts(date){return Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(date).map(x=>[x.type,x.value]))}
function offsetMinutes(utc){const p=localParts(utc),asUTC=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second);return Math.round((asUTC-utc.getTime())/60000)}
function toUtc(y,m,d,h=12){let rough=new Date(Date.UTC(y,m-1,d,h));return new Date(rough.getTime()-offsetMinutes(rough)*60000)}
function julian(date){return date.getTime()/86400000+2440587.5}
function sunAltitude(date){const D=julian(date)-2451545;const M=rad*(357.5291+0.98560028*D);const C=rad*(1.9148*Math.sin(M)+0.0200*Math.sin(2*M)+0.0003*Math.sin(3*M));const L=M+C+rad*(102.9372+180);const dec=Math.asin(Math.sin(L)*Math.sin(rad*23.4397));const ra=Math.atan2(Math.sin(L)*Math.cos(rad*23.4397),Math.cos(L));const sid=rad*(280.16+360.9856235*D+LON);const H=sid-ra;return Math.asin(Math.sin(LAT*rad)*Math.sin(dec)+Math.cos(LAT*rad)*Math.cos(dec)*Math.cos(H))/rad}
function clock(min){let h=Math.floor(min/60)%24,m=Math.round(min%60);if(m===60){h=(h+1)%24;m=0}return `${h%12||12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`}
let dayKey='',rise=0,set=0,events=[];const palette=[[-30,[12,23,46]],[-18,[26,40,70]],[-12,[65,65,105]],[-6,[139,99,129]],[-.833,[231,143,113]],[3,[246,191,117]],[12,[249,208,133]],[35,[251,216,146]],[90,[252,225,167]]];function skyColor(a){for(let i=1;i<palette.length;i++)if(a<palette[i][0]){let [v,c]=palette[i-1],[v2,c2]=palette[i],t=Math.max(0,Math.min(1,(a-v)/(v2-v)));t=t*t*(3-2*t);return c.map((x,k)=>Math.round(x+(c2[k]-x)*t))}return palette.at(-1)[1]}
function init(){let p=localParts(new Date()),key=`${p.year}-${p.month}-${p.day}`;if(key===dayKey)return;dayKey=key;let y=+p.year,m=+p.month,d=+p.day;const at=n=>sunAltitude(toUtc(y,m,d,0).getTime?new Date(toUtc(y,m,d,0).getTime()+n*60000):new Date()); // local-midnight baseline
const start=toUtc(y,m,d,0);const alt=n=>sunAltitude(new Date(start.getTime()+n*60000));const crossings=[];
for(let n=1;n<=1500;n+=2){let a=alt(n-2),b=alt(n);for(let [threshold,label] of [[-18,'astronomical'],[-12,'nautical'],[-6,'civil'],[-0.833,'sun']]){if((a<threshold&&b>=threshold)||(a>=threshold&&b<threshold)){let lo=n-2,hi=n,ascending=b>a;for(let j=0;j<16;j++){let mid=(lo+hi)/2;if((alt(mid)<threshold)===ascending)lo=mid;else hi=mid}crossings.push({minute:(lo+hi)/2,label,ascending})}}}
events=crossings.filter(e=>e.minute>=0&&e.minute<1440);rise=events.find(e=>e.label==='sun'&&e.ascending)?.minute;set=events.find(e=>e.label==='sun'&&!e.ascending)?.minute;
$('rise').textContent=rise==null?'—':clock(rise);$('set').textContent=set==null?'—':clock(set);$('duration').textContent=rise==null||set==null?'—':`${Math.floor((set-rise)/60)}h ${Math.round((set-rise)%60)}m`;
const canvas=$('sky'),ctx=canvas.getContext('2d'),w=1440;canvas.width=w;canvas.height=72;for(let n=0;n<1440;n+=2){let c=skyColor(alt(n));ctx.fillStyle=`rgb(${c.join(',')})`;ctx.fillRect(n,0,2,72)}
$('ticks').innerHTML='';for(let h=0;h<=24;h+=3){let tick=document.createElement('div');tick.className='tick';tick.style.left=`${h/24*100}%`;tick.innerHTML=`<span>${h===0||h===24?'12a':h===12?'12p':h<12?h+'a':(h-12)+'p'}</span>`;$('ticks').append(tick)}}
function drawZoom(){const canvas=$('zoom'),ctx=canvas.getContext('2d');canvas.width=720;canvas.height=55;const now=new Date(),base=now.getTime();for(let x=0;x<720;x++){let moment=new Date(base+x/720*120*60000),rgb=skyColor(sunAltitude(moment));ctx.fillStyle=`rgb(${rgb.join(',')})`;ctx.fillRect(x,0,1,55)}for(let i=1;i<4;i++){ctx.fillStyle='#ffffff30';ctx.fillRect(i*180,0,1,55)}const fmt=t=>new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit'}).format(t);for(let i=0;i<=4;i++)$('z'+i).textContent=fmt(new Date(base+i*30*60000));$('zoom-range').textContent=fmt(now)+' – '+fmt(new Date(base+120*60000))}
function update(){init();drawZoom();let p=localParts(new Date()),n=+p.hour*60+ +p.minute+ +p.second/60;$('now').style.left=`${n/1440*100}%`;let upcoming=events.find(e=>e.minute>n),alt=rise!=null&&set!=null&&n>=rise&&n<set?'Daylight': 'Night';if(upcoming){let diff=Math.ceil(upcoming.minute-n),name=upcoming.label==='sun'?(upcoming.ascending?'sunrise':'sunset'):`${upcoming.label} ${upcoming.ascending?'dawn':'dusk'}`;$('status').textContent=`${Math.floor(diff/60)?Math.floor(diff/60)+'h ':''}${diff%60}m until ${name}`;}else $('status').textContent='Next sunlight transition is tomorrow';$('title').textContent=alt}
update();setInterval(update,15000);
</script></body></html>
